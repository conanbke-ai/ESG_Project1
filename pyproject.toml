[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-forecast-monitor"
version = "2.0.0"
description = "National solar generation forecasting and anomaly alert system"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "torch",
  "xgboost",
  "optuna",
  "plotly",
  "selenium",
  "requests"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
solar-forecast = "solar_forecast.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"solar_forecast.collectors" = ["sources.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
